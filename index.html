<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1a1a" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Visor de Fotos</title>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: pan-y; }
    body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse at 20% 50%, rgba(60,40,10,.15) 0%, transparent 60%), radial-gradient(ellipse at 80% 50%, rgba(10,30,60,.15) 0%, transparent 60%); pointer-events: none; z-index: 0; }
    #app { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 14px; padding: 12px; }
    #titulo { color: rgba(255,255,255,.65); font-size: 12px; font-weight: 300; letter-spacing: .18em; text-transform: uppercase; user-select: none; text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #libro-wrapper { position: relative; display: flex; align-items: center; justify-content: center; }
    #libro-wrapper::after { content: ''; position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); width: 80%; height: 20px; background: radial-gradient(ellipse, rgba(0,0,0,.55) 0%, transparent 70%); border-radius: 50%; filter: blur(4px); pointer-events: none; }
    #libro { display: block; }
    #controles { display: flex; align-items: center; gap: 18px; user-select: none; }
    .btn-nav { width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.07); color: rgba(255,255,255,.85); font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .2s, transform .1s; -webkit-tap-highlight-color: transparent; outline: none; }
    .btn-nav:active { background: rgba(255,255,255,.2); transform: scale(.92); }
    .btn-nav:disabled { opacity: .25; pointer-events: none; }
    #indicador { color: rgba(255,255,255,.5); font-size: 12px; letter-spacing: .12em; min-width: 64px; text-align: center; }
    #hint { font-size: 11px; color: rgba(255,255,255,.28); letter-spacing: .08em; text-align: center; transition: opacity .8s; }
    #hint.oculto { opacity: 0; pointer-events: none; }
    #loader { position: fixed; inset: 0; z-index: 200; background: #1a1a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transition: opacity .5s; }
    #loader.oculto { opacity: 0; pointer-events: none; }
    .spinner { width: 42px; height: 42px; border: 3px solid rgba(255,255,255,.1); border-top-color: rgba(255,255,255,.7); border-radius: 50%; animation: spin .85s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader-texto { color: rgba(255,255,255,.45); font-size: 12px; letter-spacing: .15em; text-transform: uppercase; }
    #loader-progreso { color: rgba(255,255,255,.25); font-size: 11px; letter-spacing: .08em; }
    #barra-wrapper { width: 160px; height: 2px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; }
    #barra-fill { height: 100%; background: rgba(255,255,255,.5); border-radius: 2px; transition: width .3s ease; width: 0%; }
    #error-panel { display: none; position: fixed; inset: 0; z-index: 300; background: #1a1a1a; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 32px; }
    #error-panel.visible { display: flex; }
    #error-icono { font-size: 42px; }
    #error-msg { color: rgba(255,255,255,.55); font-size: 14px; text-align: center; line-height: 1.6; max-width: 300px; }
    #error-id { color: rgba(255,255,255,.25); font-size: 11px; font-family: monospace; letter-spacing: .05em; }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <span id="loader-texto">Detectando imagenes...</span>
      <span id="loader-progreso"></span>
    </div>
    <div id="barra-wrapper"><div id="barra-fill"></div></div>
  </div>
  <div id="error-panel">
    <span id="error-icono">&#128194;</span>
    <p id="error-msg">No se encontraron imagenes en la carpeta indicada.</p>
    <span id="error-id"></span>
  </div>
  <div id="app">
    <span id="titulo">&#10022; Visor de Fotos &#10022;</span>
    <div id="libro-wrapper"><div id="libro"></div></div>
    <div id="controles">
      <button class="btn-nav" id="btn-prev" aria-label="Anterior">&#8249;</button>
      <span id="indicador">&#8212; / &#8212;</span>
      <button class="btn-nav" id="btn-next" aria-label="Siguiente">&#8250;</button>
    </div>
    <span id="hint">&#9998; Desliza el borde de la pagina para girarla</span>
  </div>
  <script>
  (function () {
    'use strict';
    var MAX_PAGINAS = 50;
    var BATCH_SIZE = 5;
    var TIMEOUT_MS = 6000;
    var CARPETA_DEMO = 'demo';
    var params = new URLSearchParams(window.location.search);
    var albumId = (params.get('id') || CARPETA_DEMO).trim().replace(/[^a-zA-Z0-9_\-\.]/g, '');
    var basePath = './paginas/' + albumId + '/';
    document.getElementById('titulo').textContent = '\u2726 ' + albumId + ' \u2726';
    document.title = albumId;
    var loaderEl = document.getElementById('loader');
    var loaderTexto = document.getElementById('loader-texto');
    var loaderProgreso = document.getElementById('loader-progreso');
    var barraFill = document.getElementById('barra-fill');
    var errorPanel = document.getElementById('error-panel');
    var errorMsg = document.getElementById('error-msg');
    var errorIdEl = document.getElementById('error-id');
    var indicadorEl = document.getElementById('indicador');
    var pageFlip = null;
    var hintOculto = false;
    function sondearImagen(url) {
      return new Promise(function(resolve) {
        try {
          var ctrl = new AbortController();
          var timer = setTimeout(function() { ctrl.abort(); }, TIMEOUT_MS);
          fetch(url, { method: 'HEAD', signal: ctrl.signal })
            .then(function(res) { clearTimeout(timer); var ct = (res.headers.get('content-type') || '').toLowerCase(); resolve(res.ok && !ct.includes('text/html')); })
            .catch(function() { resolve(false); });
        } catch(e) { resolve(false); }
      });
    }
    async function detectarImagenes() {
      var encontradas = [];
      loaderTexto.textContent = 'Detectando imagenes...';
      for (var i = 1; i <= MAX_PAGINAS; i += BATCH_SIZE) {
        var lote = [];
        for (var j = i; j < i + BATCH_SIZE && j <= MAX_PAGINAS; j++) {
          lote.push({ n: j, url: basePath + j + '.jpg' });
        }
        var resultados = await Promise.all(lote.map(async function(item) {
          return { n: item.n, url: item.url, existe: await sondearImagen(item.url) };
        }));
        var hueco = false;
        for (var k = 0; k < resultados.length; k++) {
          var r = resultados[k];
          if (r.existe) {
            encontradas.push(r.url);
            barraFill.style.width = Math.round((r.n / MAX_PAGINAS) * 100) + '%';
            loaderProgreso.textContent = encontradas.length + ' imagen' + (encontradas.length !== 1 ? 'es' : '') + ' encontrada' + (encontradas.length !== 1 ? 's' : '');
          } else { hueco = true; }
        }
        if (hueco) break;
      }
      return encontradas;
    }
    var PRECARGA_INICIAL = 4;
    function precargarImagen(url) {
      return new Promise(function(resolve) {
        var img = new Image();
        img.onload = function() { resolve(true); };
        img.onerror = function() { resolve(false); };
        img.src = url;
      });
    }
    async function precargarInicial(imagenes) {
      loaderTexto.textContent = 'Cargando imagenes...';
      await Promise.all(imagenes.slice(0, PRECARGA_INICIAL).map(precargarImagen));
      barraFill.style.width = '100%';
    }
    function precargarResto(imagenes) {
      var resto = imagenes.slice(PRECARGA_INICIAL);
      var idx = 0;
      function next() { if (idx < resto.length) precargarImagen(resto[idx++]).then(next); }
      setTimeout(next, 800);
    }
    function calcularDimensiones() {
      var vw = window.innerWidth;
      var vh = window.innerHeight;
      var alturaDisponible = vh - 118;
      var ancho = Math.min(Math.floor(alturaDisponible * 0.707), vw - 24);
      return { ancho: ancho, alto: Math.floor(ancho / 0.707) };
    }
    function iniciarFlipbook(imagenes) {
      var dim = calcularDimensiones();
      var contenedor = document.getElementById('libro');
      if (pageFlip) { try { pageFlip.destroy(); } catch(e) {} contenedor.innerHTML = ''; }
      pageFlip = new St.PageFlip(contenedor, {
        width: dim.ancho, height: dim.alto,
        size: 'fixed', minWidth: dim.ancho, maxWidth: dim.ancho,
        minHeight: dim.alto, maxHeight: dim.alto,
        showCover: false, drawShadow: true, flippingTime: 700,
        usePortrait: true, autoSize: false, maxShadowOpacity: 0.65,
        clickEventForward: true, useMouseEvents: true,
        swipeDistance: 25, showPageCorners: true, disableFlipByClick: false, startZIndex: 10
      });
      pageFlip.loadFromImages(imagenes);
      pageFlip.on('init', function() { ocultarLoader(); actualizarIndicador(imagenes.length); actualizarBotones(imagenes.length); });
      pageFlip.on('flip', function() { actualizarIndicador(imagenes.length); actualizarBotones(imagenes.length); ocultarHint(); });
      pageFlip.on('changeState', function() { actualizarIndicador(imagenes.length); });
    }
    function actualizarIndicador(total) { if (!pageFlip) return; indicadorEl.textContent = (pageFlip.getCurrentPageIndex() + 1) + ' / ' + total; }
    function actualizarBotones(total) { if (!pageFlip) return; var idx = pageFlip.getCurrentPageIndex(); document.getElementById('btn-prev').disabled = (idx === 0); document.getElementById('btn-next').disabled = (idx >= total - 1); }
    function ocultarHint() { if (hintOculto) return; hintOculto = true; document.getElementById('hint').classList.add('oculto'); }
    function ocultarLoader() { loaderEl.classList.add('oculto'); setTimeout(function() { loaderEl.style.display = 'none'; }, 600); }
    function mostrarError(msg) { loaderEl.style.display = 'none'; errorMsg.textContent = msg; errorIdEl.textContent = 'Ruta: ' + basePath; errorPanel.classList.add('visible'); }
    document.getElementById('btn-prev').addEventListener('click', function() { if (pageFlip) pageFlip.flipPrev(); });
    document.getElementById('btn-next').addEventListener('click', function() { if (pageFlip) pageFlip.flipNext(); });
    document.addEventListener('keydown', function(e) { if (!pageFlip) return; if (e.key === 'ArrowRight' || e.key === 'ArrowDown') pageFlip.flipNext(); if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') pageFlip.flipPrev(); });
    var resizeTimer;
    window.__imagenesCargadas = null;
    window.addEventListener('resize', function() { clearTimeout(resizeTimer); resizeTimer = setTimeout(function() { if (window.__imagenesCargadas) iniciarFlipbook(window.__imagenesCargadas); }, 300); });
    async function arrancar() {
      try {
        var imagenes = await detectarImagenes();
        if (imagenes.length === 0) { mostrarError('No se encontraron imagenes en la carpeta "' + albumId + '". Verifica que existan archivos 1.jpg, 2.jpg... en la ruta indicada.'); return; }
        await precargarInicial(imagenes);
        window.__imagenesCargadas = imagenes;
        iniciarFlipbook(imagenes);
        precargarResto(imagenes);
      } catch(err) { mostrarError('Ocurrio un error al cargar el visor. Intenta recargar la pagina.'); console.error('[Visor]', err); }
    }
    window.addEventListener('DOMContentLoaded', arrancar);
  })();
  </script>
</body>
</html>
