<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1a1a" />
  <!-- Sin indexación en buscadores -->
  <meta name="robots" content="noindex, nofollow" />
  <title>Visor de Fotos</title>

  <!-- StPageFlip desde CDN -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <style>
    /* ── Reset ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #1a1a1a;
      font-family: 'Segoe UI', system-ui, sans-serif;
      touch-action: pan-y;
    }

    /* Fondo con gradiente ambiental sutil */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(60,40,10,.15) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 50%, rgba(10,30,60,.15) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    /* ── Layout principal ───────────────────────────────────── */
    #app {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; gap: 14px; padding: 12px;
    }

    /* ── Título / ID ────────────────────────────────────────── */
    #titulo {
      color: rgba(255,255,255,.65);
      font-size: 12px; font-weight: 300;
      letter-spacing: .18em; text-transform: uppercase;
      user-select: none; text-align: center;
      max-width: 100%; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }

    /* ── Libro ──────────────────────────────────────────────── */
    #libro-wrapper {
      position: relative;
      display: flex; align-items: center; justify-content: center;
    }

    /* Sombra al suelo */
    #libro-wrapper::after {
      content: '';
      position: absolute; bottom: -16px; left: 50%;
      transform: translateX(-50%);
      width: 80%; height: 20px;
      background: radial-gradient(ellipse, rgba(0,0,0,.55) 0%, transparent 70%);
      border-radius: 50%; filter: blur(4px);
      pointer-events: none;
    }

    #libro { display: block; }

    /* ── Controles ──────────────────────────────────────────── */
    #controles {
      display: flex; align-items: center; gap: 18px;
      user-select: none;
    }

    .btn-nav {
      width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.07);
      color: rgba(255,255,255,.85);
      font-size: 22px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, transform .1s;
      -webkit-tap-highlight-color: transparent; outline: none;
    }
    .btn-nav:active { background: rgba(255,255,255,.2); transform: scale(.92); }
    .btn-nav:disabled { opacity: .25; pointer-events: none; }

    #indicador {
      color: rgba(255,255,255,.5);
      font-size: 12px; letter-spacing: .12em;
      min-width: 64px; text-align: center;
    }

    /* ── Hint ───────────────────────────────────────────────── */
    #hint {
      font-size: 11px; color: rgba(255,255,255,.28);
      letter-spacing: .08em; text-align: center;
      transition: opacity .8s;
    }
    #hint.oculto { opacity: 0; pointer-events: none; }

    /* ── Loader overlay ─────────────────────────────────────── */
    #loader {
      position: fixed; inset: 0; z-index: 200;
      background: #1a1a1a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      transition: opacity .5s;
    }
    #loader.oculto { opacity: 0; pointer-events: none; }

    .spinner {
      width: 42px; height: 42px;
      border: 3px solid rgba(255,255,255,.1);
      border-top-color: rgba(255,255,255,.7);
      border-radius: 50%;
      animation: spin .85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #loader-info {
      display: flex; flex-direction: column;
      align-items: center; gap: 6px;
    }
    #loader-texto {
      color: rgba(255,255,255,.45);
      font-size: 12px; letter-spacing: .15em; text-transform: uppercase;
    }
    #loader-progreso {
      color: rgba(255,255,255,.25);
      font-size: 11px; letter-spacing: .08em;
    }

    /* Barra de progreso de carga */
    #barra-wrapper {
      width: 160px; height: 2px;
      background: rgba(255,255,255,.08);
      border-radius: 2px; overflow: hidden;
    }
    #barra-fill {
      height: 100%;
      background: rgba(255,255,255,.5);
      border-radius: 2px;
      transition: width .3s ease;
      width: 0%;
    }

    /* ── Error overlay ──────────────────────────────────────── */
    #error-panel {
      display: none;
      position: fixed; inset: 0; z-index: 300;
      background: #1a1a1a;
      flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      padding: 32px;
    }
    #error-panel.visible { display: flex; }
    #error-icono { font-size: 42px; }
    #error-msg {
      color: rgba(255,255,255,.55);
      font-size: 14px; text-align: center; line-height: 1.6;
      max-width: 300px;
    }
    #error-id {
      color: rgba(255,255,255,.25);
      font-size: 11px; font-family: monospace; letter-spacing: .05em;
    }
  </style>
</head>
<body>

  <!-- Loader -->
  <div id="loader">
    <div class="spinner"></div>
    <div id="loader-info">
      <span id="loader-texto">Detectando imágenes…</span>
      <span id="loader-progreso"></span>
    </div>
    <div class="barra-wrapper" style="width:160px;height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;">
      <div id="barra-fill" style="height:100%;background:rgba(255,255,255,.5);border-radius:2px;transition:width .3s ease;width:0%;"></div>
    </div>
  </div>

  <!-- Error panel -->
  <div id="error-panel">
    <span id="error-icono">📂</span>
    <p id="error-msg">No se encontraron imágenes en la carpeta indicada.</p>
    <span id="error-id"></span>
  </div>

  <!-- App -->
  <div id="app">
    <span id="titulo">✦ Visor de Fotos ✦</span>

    <div id="libro-wrapper">
      <div id="libro"></div>
    </div>

    <div id="controles">
      <button class="btn-nav" id="btn-prev" aria-label="Anterior">&#8249;</button>
      <span id="indicador">— / —</span>
      <button class="btn-nav" id="btn-next" aria-label="Siguiente">&#8250;</button>
    </div>

    <span id="hint">☞ Desliza el borde de la página para girarla</span>
  </div>

  <script>
  (function () {
    'use strict';

    // ── Configuración ────────────────────────────────────────────────────
    const MAX_PAGINAS   = 50;      // máximo de imágenes a intentar cargar
    const BATCH_SIZE    = 5;       // imágenes que se sondean en paralelo por ronda
    const TIMEOUT_MS    = 6000;    // ms máximo por imagen al sondear
    const CARPETA_DEMO  = 'demo';  // carpeta por defecto si no hay ?id=

    // ── Leer parámetro ?id= de la URL ────────────────────────────────────
    const params   = new URLSearchParams(window.location.search);
    const albumId  = (params.get('id') || CARPETA_DEMO).trim().replace(/[^a-zA-Z0-9_\-\.]/g, '');
    const basePath = `paginas/${albumId}/`;

    // Actualizar título con el ID del álbum
    document.getElementById('titulo').textContent = `✦ ${albumId} ✦`;
    document.title = albumId;

    // ── Referencias DOM ──────────────────────────────────────────────────
    const loaderEl      = document.getElementById('loader');
    const loaderTexto   = document.getElementById('loader-texto');
    const loaderProgreso= document.getElementById('loader-progreso');
    const barraFill     = document.getElementById('barra-fill');
    const errorPanel    = document.getElementById('error-panel');
    const errorMsg      = document.getElementById('error-msg');
    const errorIdEl     = document.getElementById('error-id');
    const indicadorEl   = document.getElementById('indicador');

    // ── Variables de estado ───────────────────────────────────────────────
    let pageFlip   = null;
    let hintOculto = false;

    // ════════════════════════════════════════════════════════════════════════
    // 1. DETECCIÓN INTELIGENTE DE IMÁGENES
    //    Sondea lotes de BATCH_SIZE imágenes en paralelo.
    //    Detiene en el primer hueco (404 / error) para evitar falsos positivos
    //    cuando el servidor responde 200 con página de error personalizada.
    //    Usa HEAD para no descargar el cuerpo.
    // ════════════════════════════════════════════════════════════════════════
    async function sondearImagen(url) {
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
        const res = await fetch(url, { method: 'HEAD', signal: ctrl.signal });
        clearTimeout(timer);
        return res.ok; // true solo si HTTP 2xx
      } catch (_) {
        return false;
      }
    }

    async function detectarImagenes() {
      const encontradas = [];
      loaderTexto.textContent = 'Detectando imágenes…';

      for (let i = 1; i <= MAX_PAGINAS; i += BATCH_SIZE) {
        // Sondear lote actual
        const lote = [];
        for (let j = i; j < i + BATCH_SIZE && j <= MAX_PAGINAS; j++) {
          lote.push({ n: j, url: `${basePath}${j}.jpg` });
        }

        const resultados = await Promise.all(
          lote.map(async (item) => ({ ...item, existe: await sondearImagen(item.url) }))
        );

        let hueco = false;
        for (const r of resultados) {
          if (r.existe) {
            encontradas.push(r.url);
            // Actualizar barra de progreso
            const pct = Math.round((r.n / MAX_PAGINAS) * 100);
            barraFill.style.width = `${pct}%`;
            loaderProgreso.textContent = `${encontradas.length} imagen${encontradas.length !== 1 ? 'es' : ''} encontrada${encontradas.length !== 1 ? 's' : ''}`;
          } else {
            hueco = true; // primer 404 → detener
          }
        }

        if (hueco) break; // no seguir si hubo un hueco en el lote
      }

      return encontradas;
    }

    // ════════════════════════════════════════════════════════════════════════
    // 2. PRECARGA PROGRESIVA
    //    Precarga las primeras N imágenes de forma completa para que el flipbook
    //    abra sin parpadeos, y el resto de forma diferida en segundo plano.
    // ════════════════════════════════════════════════════════════════════════
    const PRECARGA_INICIAL = 4; // imágenes a precargar antes de mostrar el libro

    function precargarImagen(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload  = () => resolve(true);
        img.onerror = () => resolve(false);
        img.src = url;
      });
    }

    async function precargarInicial(imagenes) {
      loaderTexto.textContent = 'Cargando imágenes…';
      const primeras = imagenes.slice(0, PRECARGA_INICIAL);
      await Promise.all(primeras.map(precargarImagen));
      barraFill.style.width = '100%';
    }

    function precargarResto(imagenes) {
      // Diferir la precarga del resto para no bloquear el hilo principal
      const resto = imagenes.slice(PRECARGA_INICIAL);
      let idx = 0;
      function cargarSiguiente() {
        if (idx >= resto.length) return;
        precargarImagen(resto[idx++]).then(cargarSiguiente);
      }
      // Iniciar después de un breve delay para no competir con el renderizado
      setTimeout(cargarSiguiente, 800);
    }

    // ════════════════════════════════════════════════════════════════════════
    // 3. DIMENSIONES RESPONSIVAS
    // ════════════════════════════════════════════════════════════════════════
    function calcularDimensiones() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const alturaDisponible = vh - 118; // espacio para título + controles + hint

      // Proporción A4 ≈ 0.707
      const anchoPorAltura = Math.floor(alturaDisponible * 0.707);
      const ancho = Math.min(anchoPorAltura, vw - 24);
      const alto  = Math.floor(ancho / 0.707);

      return { ancho, alto };
    }

    // ════════════════════════════════════════════════════════════════════════
    // 4. INICIALIZAR EL FLIPBOOK
    // ════════════════════════════════════════════════════════════════════════
    function iniciarFlipbook(imagenes) {
      const { ancho, alto } = calcularDimensiones();
      const contenedor = document.getElementById('libro');

      if (pageFlip) {
        try { pageFlip.destroy(); } catch (_) {}
        contenedor.innerHTML = '';
      }

      pageFlip = new St.PageFlip(contenedor, {
        width:              ancho,
        height:             alto,
        size:               'fixed',
        minWidth:           ancho, maxWidth:  ancho,
        minHeight:          alto,  maxHeight: alto,
        showCover:          false,
        drawShadow:         true,
        flippingTime:       700,
        usePortrait:        true,      // una página a la vez en móvil
        autoSize:           false,
        maxShadowOpacity:   0.65,
        clickEventForward:  true,
        useMouseEvents:     true,
        swipeDistance:      25,
        showPageCorners:    true,
        disableFlipByClick: false,
        startZIndex:        10,
      });

      pageFlip.loadFromImages(imagenes);

      pageFlip.on('init', () => {
        ocultarLoader();
        actualizarIndicador(imagenes.length);
        actualizarBotones(imagenes.length);
      });

      pageFlip.on('flip', () => {
        actualizarIndicador(imagenes.length);
        actualizarBotones(imagenes.length);
        ocultarHint();
      });

      pageFlip.on('changeState', () => {
        actualizarIndicador(imagenes.length);
      });
    }

    // ════════════════════════════════════════════════════════════════════════
    // 5. UI HELPERS
    // ════════════════════════════════════════════════════════════════════════
    function actualizarIndicador(total) {
      if (!pageFlip) return;
      const idx = pageFlip.getCurrentPageIndex() + 1;
      indicadorEl.textContent = `${idx} / ${total}`;
    }

    function actualizarBotones(total) {
      if (!pageFlip) return;
      const idx  = pageFlip.getCurrentPageIndex();
      document.getElementById('btn-prev').disabled = (idx === 0);
      document.getElementById('btn-next').disabled = (idx >= total - 1);
    }

    function ocultarHint() {
      if (hintOculto) return;
      hintOculto = true;
      document.getElementById('hint').classList.add('oculto');
    }

    function ocultarLoader() {
      loaderEl.classList.add('oculto');
      setTimeout(() => { loaderEl.style.display = 'none'; }, 600);
    }

    function mostrarError(msg) {
      loaderEl.style.display = 'none';
      errorMsg.textContent = msg;
      errorIdEl.textContent = `Ruta: ${basePath}`;
      errorPanel.classList.add('visible');
    }

    // ════════════════════════════════════════════════════════════════════════
    // 6. NAVEGACIÓN
    // ════════════════════════════════════════════════════════════════════════
    document.getElementById('btn-prev').addEventListener('click', () => {
      if (pageFlip) pageFlip.flipPrev();
    });
    document.getElementById('btn-next').addEventListener('click', () => {
      if (pageFlip) pageFlip.flipNext();
    });

    // Teclado (escritorio)
    document.addEventListener('keydown', (e) => {
      if (!pageFlip) return;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') pageFlip.flipNext();
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   pageFlip.flipPrev();
    });

    // Redimensionado responsivo
    let resizeTimer;
    window.__imagenesCargadas = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (window.__imagenesCargadas) iniciarFlipbook(window.__imagenesCargadas);
      }, 300);
    });

    // ════════════════════════════════════════════════════════════════════════
    // 7. ARRANQUE PRINCIPAL
    // ════════════════════════════════════════════════════════════════════════
    async function arrancar() {
      try {
        // Paso 1: detectar qué imágenes existen
        const imagenes = await detectarImagenes();

        if (imagenes.length === 0) {
          mostrarError(
            `No se encontraron imágenes en la carpeta "${albumId}".\n` +
            'Verifica que existan archivos 1.jpg, 2.jpg… en la ruta indicada.'
          );
          return;
        }

        // Paso 2: precargar primeras N imágenes
        await precargarInicial(imagenes);

        // Paso 3: guardar referencia y lanzar flipbook
        window.__imagenesCargadas = imagenes;
        iniciarFlipbook(imagenes);

        // Paso 4: precarga diferida del resto
        precargarResto(imagenes);

      } catch (err) {
        mostrarError('Ocurrió un error al cargar el visor. Intenta recargar la página.');
        console.error('[Visor]', err);
      }
    }

    window.addEventListener('DOMContentLoaded', arrancar);

  })();
  </script>
</body>
</html>
