    /* ── Reset y Base ────────────────────────────────────────────── */

    /* ── Hint Deslizar (Móvil) ───────────────────────────────────── */
    #swipe-hint {

    /* ── Loader Overlay ──────────────────────────────────────────── */
    #loader {

    .spinner {

    #loader-text {

    /* ── Panel de Error ──────────────────────────────────────────── */
    #error-panel {

    #error-panel.visible {

    }

      font-size: 11px;

  </style>

  <script>
  (function () {
    'use strict';

    // ── Configuración y Parámetros URL ─────────────────────────────
    const MAX_PAGINAS = 50;
    const BATCH_SIZE = 5;
    const TIMEOUT_MS = 6000;
    const CARPETA_DEMO = 'demo';

    const urlParams = new URLSearchParams(window.location.search);
    const clientId = (urlParams.get('id') || CARPETA_DEMO).trim().replace(/[^a-zA-Z0-9_\-\.]/g, '');
    const basePath = './paginas/' + clientId + '/';

    document.getElementById('header-title').textContent = '✦ ' + clientId + ' ✦';
    document.title = clientId + ' — Visor 3D';

    // ── Referencias DOM ─────────────────────────────────────────────
    const loaderEl = document.getElementById('loader');
    const loaderText = document.getElementById('loader-text');
    const loaderProgress = document.getElementById('loader-progress');
    const progressBarFill = document.getElementById('progress-bar-fill');
    const errorPanel = document.getElementById('error-panel');
    const errorMsg = document.getElementById('error-msg');
    const errorPath = document.getElementById('error-path');
    const pageIndicator = document.getElementById('page-indicator');
    const swipeHint = document.getElementById('swipe-hint');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnFullscreen = document.getElementById('btn-fullscreen');
    const btnSound = document.getElementById('btn-sound');
    const iconSoundOn = document.getElementById('icon-sound-on');
    const iconSoundOff = document.getElementById('icon-sound-off');
    const iconFsEnter = document.getElementById('icon-fs-enter');
    const iconFsExit = document.getElementById('icon-fs-exit');

    let pageFlip = null;
    let totalPaginas = 0;
    let hintOculto = false;
    let soundMuted = false;

    // ── 1. Efecto de Sonido Sintético de Papel (Web Audio API) ─────
    let audioCtx = null;

    function initAudioContext() {
      if (!audioCtx) {
        const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
        if (AudioCtxClass) audioCtx = new AudioCtxClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Desbloquear audio en el primer click/touch
    window.addEventListener('pointerdown', initAudioContext, { once: true });

    function playPageTurnSound() {
      if (soundMuted) return;
      try {
        initAudioContext();
        if (!audioCtx) return;

        const duration = 0.18;
        const bufferSize = Math.floor(audioCtx.sampleRate * duration);
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);

        let lastOut = 0.0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          lastOut = (lastOut + 0.02 * white) / 1.02;
          data[i] = lastOut * 3.2;
        }

        const noiseSource = audioCtx.createBufferSource();
        noiseSource.buffer = buffer;

        const bandpass = audioCtx.createBiquadFilter();
        bandpass.type = 'bandpass';
        bandpass.frequency.setValueAtTime(950, audioCtx.currentTime);
        bandpass.Q.setValueAtTime(1.3, audioCtx.currentTime);

        const gainNode = audioCtx.createGain();
        const now = audioCtx.currentTime;
        gainNode.gain.setValueAtTime(0.001, now);
        gainNode.gain.linearRampToValueAtTime(0.28, now + 0.02);
        gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);

        noiseSource.connect(bandpass);
        bandpass.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        noiseSource.start(now);
      } catch (err) {
        // Audio no disponible
      }
    }

    // ── 2. Detección Inteligente de Imágenes Secuenciales ───────────
    function sondearImagen(url) {
      return new Promise(function (resolve) {
        try {
          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);

          fetch(url, { method: 'HEAD', signal: ctrl.signal })
            .then(function (res) {
              clearTimeout(timer);
              const ct = (res.headers.get('content-type') || '').toLowerCase();
              resolve(res.ok && !ct.includes('text/html'));
            })
            .catch(function () {
              // Si falla HEAD, probar con GET ligero por seguridad
              fetch(url, { method: 'GET', signal: ctrl.signal })
                .then(function (res) {
                  clearTimeout(timer);
                  const ct = (res.headers.get('content-type') || '').toLowerCase();
                  resolve(res.ok && !ct.includes('text/html'));
                })
                .catch(() => resolve(false));
            });
        } catch (e) {
          resolve(false);
        }
      });
    }

    async function detectarImagenes() {
      const encontradas = [];
      loaderText.textContent = 'Detectando páginas…';

      for (let i = 1; i <= MAX_PAGINAS; i += BATCH_SIZE) {
        const lote = [];
        for (let j = i; j < i + BATCH_SIZE && j <= MAX_PAGINAS; j++) {
          lote.push({ n: j, url: basePath + j + '.jpg' });
        }

        const resultados = await Promise.all(
          lote.map(async (item) => ({
            n: item.n,
            url: item.url,
            existe: await sondearImagen(item.url)
          }))
        );

        let hueco = false;
        for (let k = 0; k < resultados.length; k++) {
          const r = resultados[k];
          if (r.existe) {
            encontradas.push(r.url);
            progressBarFill.style.width = Math.round((r.n / MAX_PAGINAS) * 100) + '%';
            loaderProgress.textContent = encontradas.length + ' página' + (encontradas.length !== 1 ? 's' : '') + ' encontrada' + (encontradas.length !== 1 ? 's' : '');
          } else {
            hueco = true;
          }
        }

        if (hueco) break; // Detener en el primer 404
      }

      if (encontradas.length === 0) {
        const pdfUrl = basePath + 'album.pdf';
        const pdfExiste = await sondearImagen(pdfUrl);
        if (pdfExiste) {
          loaderText.textContent = 'Cargando archivo PDF…';
          return await extraerPaginasDePdf(pdfUrl);
        }
      }

      return encontradas;
    }

    async function extraerPaginasDePdf(pdfUrl) {
      if (!window.pdfjsLib) {
        await new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
          s.onload = res;
          s.onerror = rej;
          document.head.appendChild(s);
        });
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }

      const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
      const total = pdf.numPages;
      const paginasPdf = [];

      for (let i = 1; i <= total; i++) {
        loaderText.textContent = 'Procesando PDF (' + i + ' de ' + total + ')…';
        progressBarFill.style.width = Math.round((i / total) * 100) + '%';
        loaderProgress.textContent = i + ' de ' + total + ' páginas';

        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 1.8 });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const ctx = canvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        paginasPdf.push(canvas.toDataURL('image/jpeg', 0.88));
      }
      return paginasPdf;
    }

    // ── 3. Precarga Progresiva ──────────────────────────────────────
    function precargarUna(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);
        img.src = url;
      });
    }

    async function precargarInicial(imagenes) {
      loaderText.textContent = 'Cargando visualización…';
      await Promise.all(imagenes.slice(0, 4).map(precargarUna));
      progressBarFill.style.width = '100%';
    }

    function precargarDiferida(imagenes) {
      const restantes = imagenes.slice(4);
      let idx = 0;
      function next() {
        if (idx < restantes.length) {
          precargarUna(restantes[idx++]).then(next);
        }
      }
      setTimeout(next, 600);
    }

    // ── 4. Cálculo de Dimensiones Responsivas (Móvil vs Escritorio) ─
    function calcularDimensiones() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const isMobile = vw < 768;

      // Espacio vertical disponible descontando barra superior y toolbar inferior
      const hDisponible = vh - 130;

      // Proporción aproximada estándar (hoja A4 o revista: ancho/alto ~ 0.707)
      const ratio = 0.707;

      if (isMobile) {
        // Modo SINGLE: 1 sola página centrada que encaje en pantalla
        const wMax = vw - 32;
        const ancho = Math.min(Math.floor(hDisponible * ratio), wMax);
        const alto = Math.floor(ancho / ratio);
        return {
          width: ancho,
          height: alto,
          isMobile: true
        };
      } else {
        // Modo DOUBLE: 2 páginas abiertas (spread) lado a lado
        const wTotalDisponible = vw - 80;
        const wMaxPorPagina = Math.floor(wTotalDisponible / 2);
        const anchoPagina = Math.min(Math.floor(hDisponible * ratio), wMaxPorPagina);
        const altoPagina = Math.floor(anchoPagina / ratio);
        return {
          width: anchoPagina,
          height: altoPagina,
          isMobile: false
        };
      }
    }

    // ── 5. Inicializar StPageFlip ──────────────────────────────────
    function iniciarFlipbook(imagenes) {
      const configDim = calcularDimensiones();
      const contenedor = document.getElementById('libro');

      if (pageFlip) {
        try { pageFlip.destroy(); } catch (e) {}
        contenedor.innerHTML = '';
      }

      totalPaginas = imagenes.length;

      pageFlip = new St.PageFlip(contenedor, {
        width: configDim.width,
        height: configDim.height,
        size: 'fixed',
        minWidth: configDim.width,
        maxWidth: configDim.width,
        minHeight: configDim.height,
        maxHeight: configDim.height,
        showCover: !configDim.isMobile, // En escritorio la primera página actúa como portada
        drawShadow: true,
        flippingTime: 650,
        usePortrait: configDim.isMobile, // true = 1 página en móvil; false = doble página en escritorio
        startZIndex: 10,
        autoSize: false,
        maxShadowOpacity: 0.5,
        clickEventForward: true,
        useMouseEvents: true,
        swipeDistance: 25,
        showPageCorners: true,
        disableFlipByClick: false
      });

      pageFlip.loadFromImages(imagenes);

      pageFlip.on('init', () => {
        ocultarLoader();
        actualizarUI();
      });

      pageFlip.on('flip', () => {
        actualizarUI();
        ocultarHint();
        playPageTurnSound();
      });

      pageFlip.on('changeState', () => {
        actualizarUI();
      });
    }

    // ── 6. Actualizaciones de Interfaz ─────────────────────────────
    function actualizarUI() {
      if (!pageFlip) return;

      const curr = pageFlip.getCurrentPageIndex();
      const isMobile = window.innerWidth < 768;

      if (isMobile) {
        pageIndicator.textContent = 'Página ' + (curr + 1) + ' de ' + totalPaginas;
      } else {
        // En modo libro doble (escritorio)
        if (curr === 0) {
          pageIndicator.textContent = 'Portada (1 de ' + totalPaginas + ')';
        } else if (curr >= totalPaginas - 1) {
          pageIndicator.textContent = 'Contraportada (' + totalPaginas + ' de ' + totalPaginas + ')';
        } else {
          const pagIzq = curr + 1;
          const pagDer = Math.min(curr + 2, totalPaginas);
          pageIndicator.textContent = 'Páginas ' + pagIzq + '-' + pagDer + ' de ' + totalPaginas;
        }
      }

      btnPrev.disabled = (curr <= 0);
      btnNext.disabled = (curr >= totalPaginas - 1);
    }

    function ocultarHint() {
      if (hintOculto) return;
      hintOculto = true;
      swipeHint.classList.add('hidden');
    }

    function ocultarLoader() {
      loaderEl.classList.add('hidden');
      setTimeout(() => { loaderEl.style.display = 'none'; }, 600);
    }

    function mostrarError(msg) {
      loaderEl.style.display = 'none';
      errorMsg.textContent = msg;
      errorPath.textContent = 'Ruta: ' + basePath;
      errorPanel.classList.add('visible');
    }

    // ── 7. Navegación y Controles ──────────────────────────────────
    btnPrev.addEventListener('click', () => {
      initAudioContext();
      if (pageFlip) pageFlip.flipPrev();
    });

    btnNext.addEventListener('click', () => {
      initAudioContext();
      if (pageFlip) pageFlip.flipNext();
    });

    // Teclas de flecha en teclado
    document.addEventListener('keydown', (e) => {
      if (!pageFlip) return;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        initAudioContext();
        pageFlip.flipNext();
      }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        initAudioContext();
        pageFlip.flipPrev();
      }
    });

    // Botón Silenciar / Activar Sonido
    btnSound.addEventListener('click', () => {
      soundMuted = !soundMuted;
      iconSoundOn.style.display = soundMuted ? 'none' : 'block';
      iconSoundOff.style.display = soundMuted ? 'block' : 'none';
      if (!soundMuted) playPageTurnSound();
    });

    // Botón Pantalla Completa
    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    document.addEventListener('fullscreenchange', () => {
      const isFs = !!document.fullscreenElement;
      iconFsEnter.style.display = isFs ? 'none' : 'block';
      iconFsExit.style.display = isFs ? 'block' : 'none';
    });

    // Redimensionado Responsivo (debounce)
    let resizeTimer;
    window.__imagenesCargadas = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (window.__imagenesCargadas) {
          iniciarFlipbook(window.__imagenesCargadas);
        }
      }, 300);
    });

    // ── 8. Arranque Principal ──────────────────────────────────────
    async function arrancar() {
      try {
        const imagenes = await detectarImagenes();

        if (imagenes.length === 0) {
          mostrarError(
            'No se encontraron imágenes en la carpeta "' + clientId + '".\n' +
            'Verifica que existan archivos 1.jpg, 2.jpg… en la subcarpeta paginas/' + clientId + '/'
          );
          return;
        }

        await precargarInicial(imagenes);
        window.__imagenesCargadas = imagenes;
        iniciarFlipbook(imagenes);
        precargarDiferida(imagenes);
      } catch (err) {
        mostrarError('Ocurrió un error al cargar el visor. Intenta recargar la página.');
        console.error('[Visor]', err);
      }
    }

    window.addEventListener('DOMContentLoaded', arrancar);
  })();
  </script>
</body>
</html>
